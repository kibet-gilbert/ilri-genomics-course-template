# This is the website configuration file 
# For training developers:
#  Please do not edit this file
#  Contact us if something doesn't look right on your rendered website

project:
  type: book
  output-dir: _site
  render:
    - index.md
    - setup.md
    - materials.md
    - materials/*
    - "!materials/*/no_render"

format: 
  html:
    theme: [default, _extensions/ilrigenomics/ilri-format/theme.scss]
    toc: true
    number-sections: true
    number-depth: 3
    code-link: true
    code-copy: true
    lightbox: true

filters:
  - callout-exercise

exercises:
  number: true
  hide-answers: false

execute:
  freeze: auto

knitr:
  opts_knit:
    cache.path: .knitr_cache

metadata-files:
  - "materials/_chapters.yml"

book:
  favicon: "_extensions/ilrigenomics/ilri-format/img/ilriGenomicsBioinformatics_flavicon.ico"
  page-footer: 
    center: |
      Licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) 
      ![](https://creativecommons.org/images/deed/cc_icon_black_x2.png){width=25px} 
      ILRI Genomics Platform Bioinformatics Courses
  search:
    location: sidebar
  bread-crumbs: false
  page-navigation: true
  navbar:
    pinned: true
    title: "Course Development Template Guidelines"
    logo: "_extensions/ilrigenomics/ilri-format/img/ilri_cgiar_logo.png"
    right:
      - text: "{{< iconify fa6-brands github size=lg title='ILRI Genomics Platform GitHub' >}}"
        href: https://github.com/ILRI-Genomics-Platform/
      - text: "{{< iconify mdi web size=lg title='ILRI Genomics Platform Website' >}}"
        href: https://www.ilri.org/research/facilities/genomics-platform/
  chapters:
    - part: "Welcome"
      chapters: 
        - text: "Overview"
          href: index.md
        - text: "Data & Setup"
          href: setup.md
  appendices: 
    - href: versions.md
